<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live captions: Deutsch / English</title>
<style>
  :root {
    --bg: #000;
    --en: #f6f1d3;       /* English: pale warm yellow */
    --de: #cfdbe6;       /* German: cool pale blue-grey, so the two columns are easy to tell apart */
    --dim: #7d8791;
    --fs: 5.2vh;         /* English size; German is a bit smaller. + and - change it */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--en); cursor: none; }
  body { font-family: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }

  #heads {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: grid; grid-template-columns: 1fr 1fr; gap: 4vw;
    padding: 2vh 5vw 0; font-size: 2.2vh; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim);
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 8vh 5vw 4vh;
    transition: opacity 1.2s ease;
    -webkit-mask-image: linear-gradient(to bottom, transparent 4vh, #000 28%);
            mask-image: linear-gradient(to bottom, transparent 4vh, #000 28%);
  }
  #stage.idle { opacity: 0; }

  .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4vw;
    margin: 0 0 .55em;
    opacity: 0; transform: translateY(.3em);
    transition: opacity .3s ease, transform .25s ease;
  }
  .row.in { opacity: 1; transform: none; }
  .row.old { opacity: .5; }
  .row.old .en { color: var(--dim); }

  .de, .en { margin: 0; line-height: 1.22; font-weight: 600; text-wrap: pretty; }
  .de { font-size: calc(var(--fs) * .8); color: var(--de); }
  .en { font-size: var(--fs); }
  .de.partial { opacity: .65; }                 /* preview: may still change */
  .en.pending { color: var(--dim); font-weight: 400; }

  #ctl {
    position: fixed; left: 2vw; bottom: 1.5vh; z-index: 3;
    display: none; align-items: center; gap: 1vw;
    font-size: 2.4vh; color: var(--dim);
  }
  #ctl.show { display: flex; }
  #ctl button {
    font: inherit; color: #fff; background: #2a3138; border: 1px solid #4a535c;
    border-radius: .4em; padding: .25em .9em; cursor: pointer;
  }
  #ctl button:hover { background: #38414a; }

  /* OBS / livestream overlay (/overlay): English only, transparent */
  body.overlay { background: transparent; --fs: 5.2vh; }
  body.overlay #heads, body.overlay .de { display: none; }
  body.overlay .row { grid-template-columns: 1fr; }
  body.overlay #stage { padding-bottom: 6vh; padding-top: 4vh; }
  body.overlay .en { text-shadow: 0 0 .15em #000, 0 0 .3em #000, 0 .04em .12em #000; }

  @media (max-width: 800px) {
    .row, #heads { grid-template-columns: 1fr; gap: .2em; }
    #heads { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .row, #stage { transition: none; transform: none; }
  }
</style>
</head>
<body>
<div id="heads"><div>Deutsch</div><div>English</div></div>
<div id="stage"></div>
<div id="ctl"><span id="statusText"></span><button id="startStop" type="button">Start</button></div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const ctl = document.getElementById('ctl');
  const statusText = document.getElementById('statusText');
  const startStop = document.getElementById('startStop');
  const params = new URLSearchParams(location.search);
  const MAX_ROWS = 7;          // caption rows kept on screen
  const IDLE_MS = 20000;       // fade everything out after this much silence
  const rows = new Map();      // segment id -> {el, de, en}
  let paused = false, idleTimer = null, ctlTimer = null, autostarted = false;
  let status = {state: 'stopped', text: ''};
  let ws = null;

  if (params.has('overlay')) document.body.classList.add('overlay');

  // ---- text size, remembered
  const root = document.documentElement;
  const defaultFs = parseFloat(getComputedStyle(root).getPropertyValue('--fs')) || 5.2;
  let scale = 1;
  try { scale = parseFloat(localStorage.getItem('fsScale')) || 1; } catch (e) {}
  const applyScale = () => root.style.setProperty('--fs', (defaultFs * scale).toFixed(2) + 'vh');
  applyScale();

  // ---- rows
  function touch() {
    stage.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => stage.classList.add('idle'), IDLE_MS);
  }
  function refreshOld() {
    const list = [...stage.children];
    list.forEach((el, i) => el.classList.toggle('old', i < list.length - 2));
  }
  function getRow(id) {
    let r = rows.get(id);
    if (r) return r;
    const el = document.createElement('div'); el.className = 'row';
    const de = document.createElement('p'); de.className = 'de partial';
    const en = document.createElement('p'); en.className = 'en';
    el.append(de, en);
    stage.appendChild(el);
    r = {el, de, en};
    rows.set(id, r);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    while (stage.children.length > MAX_ROWS) {
      const first = stage.firstChild;
      for (const [k, v] of rows) if (v.el === first) rows.delete(k);
      stage.removeChild(first);
    }
    refreshOld();
    return r;
  }
  function removeRow(id) {
    const r = rows.get(id);
    if (!r) return;
    const hasEnglish = r.en.textContent.trim() && !r.en.classList.contains('pending');
    if (!hasEnglish) { r.el.remove(); rows.delete(id); refreshOld(); }
  }

  function onGerman(m) {
    if (paused) return;
    if (m.final && !m.de) { removeRow(m.id); return; }
    const r = getRow(m.id);
    r.de.textContent = m.de;
    r.de.classList.toggle('partial', !m.final);
    if (m.final && !r.en.textContent) {       // German is final, English is on its way
      r.en.textContent = '…';
      r.en.classList.add('pending');
    }
    touch();
  }
  function onEnglish(m) {
    if (paused) return;
    const r = getRow(m.id);
    r.en.textContent = m.en;
    r.en.classList.remove('pending');
    touch();
  }
  function setPaused(p) {
    paused = p;
    stage.style.visibility = p ? 'hidden' : 'visible';
    if (p) { stage.innerHTML = ''; rows.clear(); }
    showCtl(false);
  }

  // ---- control strip (status + Start/Stop)
  const running = () => status.state === 'ready' || status.state === 'loading';
  function renderCtl() {
    statusText.textContent = (!ws || ws.readyState !== 1) ? 'Reconnecting…' : (status.text || status.state);
    startStop.textContent = running() ? 'Stop' : 'Start';
    startStop.disabled = status.state === 'stopping';
  }
  function showCtl(temporary) {
    renderCtl();
    const mustShow = !paused && (status.state !== 'ready' || !ws || ws.readyState !== 1);
    ctl.classList.toggle('show', mustShow || temporary);
    clearTimeout(ctlTimer);
    if (temporary && !mustShow) ctlTimer = setTimeout(() => ctl.classList.remove('show'), 3000);
  }
  async function toggleRun() {
    try { await fetch(running() ? '/api/stop' : '/api/start', {method: 'POST'}); } catch (e) {}
  }
  startStop.addEventListener('click', toggleRun);

  // ---- WebSocket with automatic reconnect
  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => showCtl(false);
    ws.onclose = () => { showCtl(false); setTimeout(connect, 1000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'german') onGerman(m);
      else if (m.type === 'english') onEnglish(m);
      else if (m.type === 'pause') setPaused(m.paused);
      else if (m.type === 'status') {
        status = m;
        if (m.state === 'loading') { stage.innerHTML = ''; rows.clear(); }   // new run, clean slate
        showCtl(false);
        if (m.state === 'stopped' && params.has('autostart') && !autostarted) {
          autostarted = true; toggleRun();
        }
      }
    };
  }
  connect();

  // ---- keyboard: f fullscreen, + / - size, c captions on/off, s start/stop, t test line
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } else if (e.key === '+' || e.key === '=') {
      scale = Math.min(scale * 1.1, 2); applyScale();
      try { localStorage.setItem('fsScale', scale); } catch (err) {}
    } else if (e.key === '-') {
      scale = Math.max(scale / 1.1, 0.4); applyScale();
      try { localStorage.setItem('fsScale', scale); } catch (err) {}
    } else if (e.key === 'c') {
      fetch('/api/toggle', {method: 'POST'});
    } else if (e.key === 's') {
      toggleRun();
    } else if (e.key === 't') {
      const id = 'test-' + Date.now();
      onGerman({id, de: 'Der Herr ist mein Hirte, mir wird nichts mangeln.', final: true});
      setTimeout(() => onEnglish({id, en: 'The Lord is my shepherd, I shall not want.'}), 1200);
    }
  });
  document.addEventListener('mousemove', () => {
    document.body.style.cursor = 'default';
    clearTimeout(window.__cur);
    window.__cur = setTimeout(() => document.body.style.cursor = 'none', 2000);
    showCtl(true);
  });
})();
</script>
</body>
</html>
