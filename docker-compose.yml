# CPU test (any machine):      docker compose --profile cpu up --build
# GPU production (Linux+NVIDIA): docker compose --profile gpu up -d --build
#
# Override the server options without editing this file, e.g.
#   CAPTIONS_ARGS="--file /samples/test.wav --model base" docker compose --profile cpu up

x-common: &common
  ports:
    - "127.0.0.1:8000:8000"          # only this computer; use "8000:8000" to allow the network
  volumes:
    - ./logs:/app/logs                # caption logs for the weekly review
    - ./glossary.json:/app/glossary.json   # edit on the host, applied live
    - ./samples:/samples:ro           # put test.wav here
    - hf-cache:/root/.cache/huggingface    # models are downloaded once

services:
  captions-cpu:
    <<: *common
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile
    # Docker on a Mac cannot reach the microphone, so the CPU service defaults to the test file.
    command: python server.py --host 0.0.0.0 ${CAPTIONS_ARGS:---file /samples/test.wav}

  captions-gpu:
    <<: *common
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    restart: unless-stopped
    command: python3 server.py --host 0.0.0.0 --device cuda --model large-v3-turbo ${CAPTIONS_ARGS:-}
    # Live audio from the USB interface (Linux only). Remove these two lines for file-only tests.
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
